<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 160" preserveAspectRatio="none">
  <!-- «Мастер» → «Галерея»: только медная линия волны и мягкая тень под ней.
       Тёмная заливка волны — продолжение фона «Мастера» (зеркальный master-bg.webp, маска seam-portfolio-mask.svg),
       см. .lb-portfolio__bg::after в _seam.scss -->
  <defs>
    <linearGradient id="line" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#c79a80" stop-opacity=".15"/>
      <stop offset=".4" stop-color="#c79a80" stop-opacity=".75"/>
      <stop offset=".82" stop-color="#d2a68c" stop-opacity=".9"/>
      <stop offset="1" stop-color="#c79a80" stop-opacity=".2"/>
    </linearGradient>
    <filter id="blur" x="-5%" y="-60%" width="110%" height="220%"><feGaussianBlur stdDeviation="9"/></filter>
  </defs>
  <path fill="none" stroke="#2f2521" stroke-opacity=".12" stroke-width="16" filter="url(#blur)" transform="translate(0 10)" d="M1920 102C1540 150 1240 96 920 58S320 24 0 92"/>
  <path fill="none" stroke="#e7c2aa" stroke-opacity=".35" stroke-width="6" filter="url(#blur)" d="M1920 102C1540 150 1240 96 920 58S320 24 0 92"/>
  <path fill="none" stroke="url(#line)" stroke-width="1.6" d="M1920 102C1540 150 1240 96 920 58S320 24 0 92"/>
</svg>
