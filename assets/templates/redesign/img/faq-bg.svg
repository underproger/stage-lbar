<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1100" preserveAspectRatio="xMidYMid slice">
  <!-- Фон блока FAQ: только графика (без фото). Свет за заголовком слева, большой мягкий диск за списком вопросов справа,
       тонкие медные кольца-«орбиты» слева внизу (под кнопками) и дуга по краю диска. Сетка — 1920: колонка текста 143…783, список 860…1777. -->
  <defs>
    <radialGradient id="f-sun" cx="420" cy="300" r="620" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#fff" stop-opacity=".7"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="f-disk" cx="1360" cy="420" r="640" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ead9cd" stop-opacity=".75"/>
      <stop offset=".62" stop-color="#eedfd4" stop-opacity=".55"/>
      <stop offset="1" stop-color="#f3e8e0" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="f-disklight" cx="1240" cy="260" r="460" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#fffaf6" stop-opacity=".55"/>
      <stop offset="1" stop-color="#fffaf6" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="f-arc" x1="760" y1="0" x2="1900" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#b8906f" stop-opacity="0"/>
      <stop offset=".35" stop-color="#b8906f" stop-opacity=".5"/>
      <stop offset=".8" stop-color="#b8906f" stop-opacity=".55"/>
      <stop offset="1" stop-color="#b8906f" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="f-ring" x1="0" y1="560" x2="0" y2="1060" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#b8906f" stop-opacity=".65"/>
      <stop offset="1" stop-color="#b8906f" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="f-warm" cx="120" cy="780" r="320" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ead8cb" stop-opacity=".7"/>
      <stop offset="1" stop-color="#ead8cb" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1920" height="1100" fill="url(#f-sun)"/>
  <rect width="1920" height="1100" fill="url(#f-warm)"/>

  <!-- мягкий диск за списком вопросов -->
  <circle cx="1360" cy="420" r="640" fill="url(#f-disk)"/>
  <circle cx="1360" cy="420" r="640" fill="url(#f-disklight)"/>
  <!-- тонкая медная дуга по краю диска -->
  <path d="M760 300A610 610 0 0 1 1900 150" fill="none" stroke="url(#f-arc)" stroke-width="1.4"/>
  <path d="M820 930A610 610 0 0 0 1900 690" fill="none" stroke="url(#f-arc)" stroke-width="1" opacity=".7"/>

  <!-- медные кольца-«орбиты» слева внизу -->
  <g fill="none" stroke="url(#f-ring)">
    <circle cx="180" cy="1010" r="300" stroke-width="1.4"/>
    <circle cx="180" cy="1010" r="350" stroke-width="1" opacity=".7"/>
    <circle cx="180" cy="1010" r="410" stroke-width=".8" opacity=".45"/>
  </g>
  <!-- точка на орбите -->
  <circle cx="448" cy="872" r="5" fill="#c49a78" opacity=".55"/>
</svg>
