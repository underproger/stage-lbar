<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" preserveAspectRatio="xMidYMid slice">
  <!-- Фон страниц 404 и «Спасибо»: только графика. Тёплый светлый тон, свет по центру за «404» / печатью,
       мягкие пятна по краям, тонкие медные овалы-«порталы» вокруг центра (как арки баннера), волна снизу слева, искры. -->
  <defs>
    <linearGradient id="b" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fbf6f2"/>
      <stop offset=".6" stop-color="#f8f0ea"/>
      <stop offset="1" stop-color="#f5ebe4"/>
    </linearGradient>
    <radialGradient id="sun" cx="960" cy="430" r="620" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#fff" stop-opacity=".95"/>
      <stop offset=".55" stop-color="#fff" stop-opacity=".45"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="rose-r" cx="1760" cy="820" r="560" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ead0c0" stop-opacity=".75"/>
      <stop offset="1" stop-color="#ead0c0" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="rose-l" cx="140" cy="180" r="520" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#efdccf" stop-opacity=".7"/>
      <stop offset="1" stop-color="#efdccf" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="arc" gradientUnits="userSpaceOnUse" x1="0" y1="40" x2="0" y2="1000">
      <stop offset="0" stop-color="#c8937c" stop-opacity=".55"/>
      <stop offset=".55" stop-color="#c8937c" stop-opacity=".3"/>
      <stop offset="1" stop-color="#c8937c" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="wave" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#c8937c" stop-opacity="0"/>
      <stop offset=".35" stop-color="#c8937c" stop-opacity=".45"/>
      <stop offset="1" stop-color="#c8937c" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <rect width="1920" height="1080" fill="url(#b)"/>
  <rect width="1920" height="1080" fill="url(#rose-l)"/>
  <rect width="1920" height="1080" fill="url(#rose-r)"/>
  <rect width="1920" height="1080" fill="url(#sun)"/>
  <g fill="none" stroke="url(#arc)">
    <ellipse cx="960" cy="560" rx="560" ry="500" stroke-width="1.3"/>
    <ellipse cx="960" cy="560" rx="660" ry="560" stroke-width="1"/>
    <ellipse cx="960" cy="560" rx="790" ry="640" stroke-width=".8"/>
  </g>
  <path fill="none" stroke="url(#wave)" stroke-width="1.4" d="M-40 930c220-90 430-110 640-60s400 110 640 40"/>
  <path fill="none" stroke="url(#wave)" stroke-width="1" d="M-40 980c240-80 460-90 660-40s420 100 700 20"/>
  <g fill="#c8937c">
    <path opacity=".7" d="M1540 210c.6 6.6 5.2 11.5 12.3 12.3-7.1.8-11.7 5.7-12.3 12.3-.6-6.6-5.2-11.5-12.3-12.3 7.1-.8 11.7-5.7 12.3-12.3z"/>
    <path opacity=".5" d="M372 640c.4 4.4 3.5 7.7 8.2 8.2-4.7.5-7.8 3.8-8.2 8.2-.4-4.4-3.5-7.7-8.2-8.2 4.7-.5 7.8-3.8 8.2-8.2z"/>
    <path opacity=".45" d="M1660 560c.4 4 3.1 7 7.4 7.4-4.3.4-7 3.4-7.4 7.4-.4-4-3.1-7-7.4-7.4 4.3-.4 7-3.4 7.4-7.4z"/>
    <circle cx="480" cy="260" r="2.4" opacity=".45"/>
    <circle cx="1450" cy="760" r="2" opacity=".4"/>
    <circle cx="300" cy="420" r="1.6" opacity=".35"/>
  </g>
</svg>
