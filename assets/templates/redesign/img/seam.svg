<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 760" preserveAspectRatio="none">
  <defs>
    <linearGradient id="band" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#fff" stop-opacity="0"/>
      <stop offset=".25" stop-color="#fff" stop-opacity=".55"/>
      <stop offset=".7" stop-color="#fff" stop-opacity=".45"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="line" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#c49a83" stop-opacity="0"/>
      <stop offset=".2" stop-color="#c49a83" stop-opacity=".5"/>
      <stop offset=".8" stop-color="#c49a83" stop-opacity=".45"/>
      <stop offset="1" stop-color="#c49a83" stop-opacity="0"/>
    </linearGradient>
    <filter id="soft" x="-5%" y="-30%" width="110%" height="160%">
      <feGaussianBlur stdDeviation="14"/>
    </filter>
  </defs>
  <!-- мягкая «шёлковая» лента, проходящая через стык блоков -->
  <path filter="url(#soft)" fill="url(#band)" d="M-40 548C360 452 660 640 1010 470S1620 238 1960 196L1960 262C1630 300 1360 420 1040 548S380 520-40 616Z"/>
  <!-- тонкие медные линии по краям ленты -->
  <path fill="none" stroke="url(#line)" stroke-width="1.4" d="M-40 560C370 466 660 650 1010 480S1620 248 1960 206"/>
  <path fill="none" stroke="url(#line)" stroke-width="1" stroke-opacity=".6" d="M-40 606C390 520 700 690 1040 538S1630 304 1960 262"/>
</svg>
